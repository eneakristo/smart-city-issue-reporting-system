spring:
  application:
    name: smart-city-issue-reporting
  profiles:
    default: local
  jackson:
    time-zone: UTC
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${APP_JWT_SECRET:}
    access-token-expiration-minutes: ${APP_JWT_ACCESS_MINUTES:60}
    refresh-token-expiration-days: ${APP_JWT_REFRESH_DAYS:7}
  storage:
    supabase-url: ${SUPABASE_URL:}
    supabase-service-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    supabase-bucket: ${SUPABASE_STORAGE_BUCKET:issue-image}
    issue-image-object-prefix: ${APP_ISSUE_IMAGE_OBJECT_PREFIX:issues}
    max-image-file-size-bytes: ${APP_MAX_IMAGE_FILE_SIZE_BYTES:5242880}
    allowed-image-content-types: ${APP_ALLOWED_IMAGE_CONTENT_TYPES:image/jpeg,image/jpg,image/png,image/webp}
  geocoding:
    enabled: ${APP_GEOCODING_ENABLED:true}
    base-url: ${APP_GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    search-path: ${APP_GEOCODING_SEARCH_PATH:/search}
    user-agent: ${APP_GEOCODING_USER_AGENT:smart-city-issue-reporting/1.0}
    default-query-suffix: ${APP_GEOCODING_DEFAULT_QUERY_SUFFIX:Tirana, Albania}
    country-code: ${APP_GEOCODING_COUNTRY_CODE:al}
    result-limit: ${APP_GEOCODING_RESULT_LIMIT:1}
  zoning:
    split-latitude: ${APP_ZONE_SPLIT_LATITUDE:41.3275}
    split-longitude: ${APP_ZONE_SPLIT_LONGITUDE:19.8187}
  prioritization:
    city-center-latitude: ${APP_PRIORITY_CENTER_LATITUDE:41.3275}
    city-center-longitude: ${APP_PRIORITY_CENTER_LONGITUDE:19.8187}
    vote-count-for-full-score: ${APP_PRIORITY_FULL_VOTES:20}
    duplicate-count-for-full-score: ${APP_PRIORITY_FULL_DUPLICATES:5}
  system-admin:
    bootstrap-email: ${APP_SYSTEM_ADMIN_EMAIL:}
  password-reset:
    frontend-reset-url: ${APP_PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}
    token-expiration-minutes: ${APP_PASSWORD_RESET_TOKEN_MINUTES:30}
  email:
    provider: ${APP_EMAIL_PROVIDER:brevo}
    brevo-api-key: ${BREVO_API_KEY:}
    from-address: ${APP_EMAIL_FROM_ADDRESS:}
    from-name: ${APP_EMAIL_FROM_NAME:Smart City Issue Reporting}
    brevo-base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}

logging:
  level:
    org.springframework.security: INFO
