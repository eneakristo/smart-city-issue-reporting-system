spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${APP_JWT_SECRET}

app.storage.supabase-url=${SUPABASE_URL:}
app.storage.supabase-service-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.supabase-bucket=${SUPABASE_STORAGE_BUCKET:issue-image}
app.email.provider=${APP_EMAIL_PROVIDER:brevo}
app.email.brevo-api-key=${BREVO_API_KEY:}
app.email.from-address=${APP_EMAIL_FROM_ADDRESS:}
app.email.from-name=${APP_EMAIL_FROM_NAME:Smart City Issue Reporting}
app.email.brevo-base-url=${BREVO_BASE_URL:https://api.brevo.com/v3}

server.port=${PORT:8080}
